<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PollWave | Voting & Polling</title><style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color-scheme:dark;--bg:#10111f;--card:#1d2034;--ink:#f7f7fc;--muted:#aeb4cc;--line:#343850;--field:#292d46;--accent:#ab7bff;--accent2:#f38bc2}body.light{color-scheme:light;--bg:#f4f5fb;--card:#fff;--ink:#192038;--muted:#5d6682;--line:#dfe2ef;--field:#f0f2fa}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top left,#7d5dc522,transparent 50%),var(--bg);color:var(--ink);min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}header{display:flex;align-items:center;justify-content:space-between;padding:20px max(24px,calc((100vw - 1120px)/2));border-bottom:1px solid var(--line);gap:14px;flex-wrap:wrap}.brand{font-size:25px;font-weight:850;letter-spacing:-1px}.brand span{display:inline-grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:12px;width:40px;height:40px;margin-right:10px;color:#fff;transform:rotate(-8deg)}nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center}button{border:0;border-radius:11px;padding:11px 16px;font-weight:700;background:var(--field);color:var(--ink)}button.primary{background:linear-gradient(105deg,#8b72f9,#ee87c3);color:white}button.danger{background:#aa3851;color:white}button:disabled{opacity:.5;cursor:not-allowed}main{max-width:1120px;margin:38px auto;padding:0 20px}.auth{max-width:480px;margin:50px auto}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px;box-shadow:0 12px 40px #00000012}.card h1,.card h2{margin:0 0 10px}p,.muted{color:var(--muted)}label{display:block;margin:16px 0 6px;font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}input,select,textarea{width:100%;background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:11px;padding:13px;outline:none}textarea{min-height:88px}input:focus,textarea:focus,select:focus{border-color:var(--accent)}.full{width:100%;margin-top:20px}.link{background:none;color:var(--accent);padding:4px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin:20px 0}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:15px}.stat strong{font-size:32px;display:block;margin-top:8px}.pill{display:inline-block;padding:5px 10px;border-radius:30px;background:#a779ff29;color:var(--accent);font-size:12px;font-weight:800}.poll h3{margin:12px 0 8px}.poll small{color:var(--muted)}.option{display:flex;align-items:center;gap:12px;padding:13px;margin:9px 0;border:1px solid var(--line);border-radius:12px}.option input{width:auto}.bar{height:9px;background:var(--field);border-radius:10px;overflow:hidden;margin:7px 0 15px}.bar div{height:100%;background:linear-gradient(90deg,#8b72f9,#ee87c3)}.notice{padding:12px 14px;background:#a779ff20;border:1px solid #a779ff55;border-radius:10px;margin:15px 0}.error{color:#ff8c9a}.success{color:#67d6ac}.actions{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none!important}hr{border:0;border-top:1px solid var(--line);margin:20px 0}footer{text-align:center;padding:35px;color:var(--muted);font-size:12px}.section-title{margin-top:36px}details{margin-top:14px}summary{cursor:pointer;font-weight:700}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:650px){.two{grid-template-columns:1fr}.card{padding:19px}main{margin:22px auto}header{padding:15px 20px}} 
</style></head><body><header><div class="brand"><span>P</span>PollWave</div><nav><button onclick="toggleTheme()" id="themeBtn">☀ Light</button><button id="homeBtn" class="hidden" onclick="home()">Dashboard</button><button id="historyBtn" class="hidden" onclick="historyView()">My votes</button><button id="profileBtn" class="hidden" onclick="profileView()">Profile</button><button id="logoutBtn" class="hidden" onclick="logout()">Log out</button></nav></header><main id="app"></main><footer>PollWave • Student project demonstration • Data is stored in this browser only</footer><script>
const KEY='pollwave_demo_v2';const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);const iso=(n)=>new Date(Date.now()+n*86400000).toISOString().slice(0,10);const sample=()=>{let users=[{id:'admin',name:'Demo Administrator',email:'admin@pollwave.demo',password:'Admin@123',role:'admin',city:'Jaipur',age:25}];for(let i=1;i<=8;i++)users.push({id:'demo'+i,name:'Demo Voter '+i,email:`voter${i}@demo.test`,password:'Demo@123',role:'voter',city:'Jaipur',age:20});let polls=[{id:'cars',title:'Car Manufacturer of the Year',description:'Vote for your favourite automobile manufacturer.',start:iso(-3),end:iso(12),active:true,archived:false,visibility:'afterVote',options:['BMW','Mercedes-Benz','Toyota','Honda','Audi'].map(x=>({id:id(),name:x}))},{id:'code',title:'Best Programming Language',description:'Which programming language do you enjoy most?',start:iso(-2),end:iso(10),active:true,archived:false,visibility:'always',options:['Python','Java','JavaScript','C++'].map(x=>({id:id(),name:x}))},{id:'sports',title:'Sports Captain',description:'Choose the team captain for this term.',start:iso(-15),end:iso(-1),active:true,archived:false,visibility:'afterClose',options:['Candidate A','Candidate B','Candidate C'].map(x=>({id:id(),name:x}))}];let votes=[];for(const u of users.slice(1)){for(const p of polls){let o=p.options[Math.floor(Math.random()*p.options.length)];votes.push({id:id(),userId:u.id,pollId:p.id,optionId:o.id,date:new Date().toISOString()})}}return{users,polls,votes,session:null,theme:'dark'}};let db;try{db=JSON.parse(localStorage.getItem(KEY))||sample()}catch{db=sample()}function save(){localStorage.setItem(KEY,JSON.stringify(db))}save();let app=document.getElementById('app');const me=()=>db.users.find(u=>u.id===db.session);const pollStatus=p=>p.archived?'Archived':!p.active?'Inactive':new Date(p.start+'T00:00:00')>new Date()?'Upcoming':new Date(p.end+'T23:59:59')<new Date()?'Closed':'Active';const voteFor=(u,p)=>db.votes.find(v=>v.userId===u&&v.pollId===p);const resultsAllowed=(p,u)=>p.visibility==='always'||(p.visibility==='afterVote'&&!!voteFor(u,p.id))||(p.visibility==='afterClose'&&pollStatus(p)==='Closed');const notice=(t,cls='error')=>`<div class="notice ${cls}">${escapeHTML(t)}</div>`;function syncNav(){let logged=!!me();for(let x of ['homeBtn','logoutBtn','profileBtn'])document.getElementById(x).classList.toggle('hidden',!logged);document.getElementById('historyBtn').classList.toggle('hidden',!logged||me().role==='admin');document.body.classList.toggle('light',db.theme==='light');document.getElementById('themeBtn').textContent=db.theme==='light'?'☾ Dark':'☀ Light'}function toggleTheme(){db.theme=db.theme==='dark'?'light':'dark';save();syncNav()}function auth(which='login',msg=''){db.session=null;save();syncNav();app.innerHTML=`<div class="auth card"><h1>${which==='login'?'Welcome back': 'Create an account'}</h1><p>${which==='login'?'Sign in to vote and manage polls.':'Register to participate in polls.'}</p>${msg?notice(msg):''}<form id="authForm">${which==='register'?`<label>Full name</label><input name="name" required minlength="2" autocomplete="name"><label>Gmail address</label><input name="email" type="email" placeholder="name@gmail.com" required><div class="two"><div><label>City</label><input name="city" required></div><div><label>Age</label><input name="age" type="number" min="13" max="120" required></div></div>`:`<label>Email</label><input name="email" type="email" required autocomplete="username">`}<label>Password</label><input name="password" type="password" minlength="8" required autocomplete="${which==='login'?'current-password':'new-password'}"><button class="primary full">${which==='login'?'Log in':'Create account'}</button></form><p style="text-align:center">${which==='login'?`New here? <button class="link" onclick="auth('register')">Register</button>`:`Already registered? <button class="link" onclick="auth('login')">Log in</button>`}</p><div class="notice"><b>Demo voter:</b> voter1@demo.test / Demo@123<br><b>Demo admin:</b> admin@pollwave.demo / Admin@123<br><small>Demo credentials only. Do not reuse real passwords.</small></div></div>`;document.getElementById('authForm').onsubmit=e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.target));let email=v.email.trim().toLowerCase();if(which==='register'){if(!/^[a-z0-9._%+-]+@gmail\.com$/.test(email))return auth('register','Please enter a Gmail address. This demo cannot verify mailbox ownership.');if(db.users.some(u=>u.email===email))return auth('register','This email is already registered.');db.users.push({id:id(),name:v.name.trim(),email,password:v.password,role:'voter',city:v.city.trim(),age:Number(v.age)});save();return auth('login','Account created. Please log in.')}let user=db.users.find(u=>u.email===email&&u.password===v.password);if(!user)return auth('login','Incorrect email or password.');db.session=user.id;save();home()}}function logout(){db.session=null;save();auth('login')}function home(){syncNav();if(!me())return auth();if(me().role==='admin')return admin();let polls=db.polls.filter(p=>!p.archived);app.innerHTML=`<div class="row"><div><h1>Welcome, ${escapeHTML(me().name)} 👋</h1><p>Explore polls and cast your vote.</p></div><span class="pill">Voter dashboard</span></div><div class="stats"><div class="card stat">Available polls<strong>${polls.length}</strong></div><div class="card stat">Your votes<strong>${db.votes.filter(v=>v.userId===me().id).length}</strong></div><div class="card stat">Active polls<strong>${polls.filter(p=>pollStatus(p)==='Active').length}</strong></div></div><h2 class="section-title">Available polls</h2><div class="grid">${polls.map(p=>`<div class="card poll"><span class="pill">${pollStatus(p)}</span><h3>${escapeHTML(p.title)}</h3><p>${escapeHTML(p.description)}</p><small>${p.start} to ${p.end}</small><div class="row" style="margin-top:18px"><span class="muted">${voteFor(me().id,p.id)?'✓ Voted':'Not voted'}</span><button class="primary" onclick="openPoll('${p.id}')">View poll</button></div></div>`).join('')}</div>`}function openPoll(pid,msg=''){let p=db.polls.find(p=>p.id===pid);if(!p||!me())return home();let v=voteFor(me().id,p.id),status=pollStatus(p);app.innerHTML=`<button onclick="home()">← Back to polls</button><div class="card" style="max-width:790px;margin:20px auto"><div class="row"><h1>${escapeHTML(p.title)}</h1><span class="pill">${status}</span></div><p>${escapeHTML(p.description)}</p><p><b>Start:</b> ${p.start} &nbsp; <b>End:</b> ${p.end}</p>${msg?notice(msg,'success'):''}${v?notice('Your vote has been recorded. You cannot vote again in this poll.','success'):status==='Active'?`<form id="voteForm"><h3>Choose one option</h3>${p.options.map(o=>`<label class="option"><input type="radio" name="option" value="${o.id}" required> ${escapeHTML(o.name)}</label>`).join('')}<button class="primary full">Cast vote</button></form>`:notice('Voting is not available for this poll.')}<hr><h2>Results</h2><div id="results">${resultsAllowed(p,me().id)?resultsHTML(p):'<p>Results are hidden until the visibility conditions are met.</p>'}</div></div>`;let form=document.getElementById('voteForm');if(form)form.onsubmit=e=>{e.preventDefault();let option=new FormData(form).get('option');let name=p.options.find(o=>o.id===option)?.name;if(!name)return;if(!confirm(`Are you sure you want to vote for ${name}?\nYou cannot change your vote after submission.`))return;if(voteFor(me().id,p.id))return openPoll(pid,'You have already voted.');db.votes.push({id:id(),userId:me().id,pollId:p.id,optionId:option,date:new Date().toISOString()});save();openPoll(pid,'Your vote was successfully recorded!')}}function resultsHTML(p){let vs=db.votes.filter(v=>v.pollId===p.id),total=vs.length;return `<p>${total} total votes</p>${p.options.map(o=>{let n=vs.filter(v=>v.optionId===o.id).length,per=total?Math.round(n/total*100):0;return `<div class="row"><b>${escapeHTML(o.name)}</b><span>${n} votes (${per}%)</span></div><div class="bar"><div style="width:${per}%"></div></div>`}).join('')}`}function historyView(){if(!me())return auth();app.innerHTML=`<h1>My voting history</h1><div class="grid">${db.votes.filter(v=>v.userId===me().id).map(v=>{let p=db.polls.find(p=>p.id===v.pollId);return `<div class="card"><h3>${escapeHTML(p?.title||'Removed poll')}</h3><p>Voted for: ${escapeHTML(p?.options.find(o=>o.id===v.optionId)?.name||'Unknown')}</p><small>${new Date(v.date).toLocaleString()}</small></div>`}).join('')||'<p>No votes yet.</p>'}</div>`}function profileView(msg=''){if(!me())return auth();let u=me();app.innerHTML=`<div class="card" style="max-width:600px;margin:auto"><h1>My profile</h1>${msg?notice(msg,'success'):''}<form id="profileForm"><label>Full name</label><input name="name" value="${escapeHTML(u.name)}" required><label>Email</label><input value="${escapeHTML(u.email)}" disabled><label>City</label><input name="city" value="${escapeHTML(u.city)}"><label>Age</label><input name="age" type="number" min="13" max="120" value="${u.age}"><label>New password (leave blank to keep current)</label><input name="password" type="password" minlength="8"><button class="primary full">Save changes</button></form></div>`;document.getElementById('profileForm').onsubmit=e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.target));u.name=v.name.trim();u.city=v.city.trim();u.age=Number(v.age);if(v.password)u.password=v.password;save();profileView('Profile updated.')}}function admin(){if(!me()||me().role!=='admin')return home();let active=db.polls.filter(p=>pollStatus(p)==='Active').length;app.innerHTML=`<div class="row"><div><h1>Admin dashboard</h1><p>Create and manage polls and view participation.</p></div><button class="primary" onclick="pollEditor()">+ Create poll</button></div><div class="stats"><div class="card stat">Registered voters<strong>${db.users.filter(u=>u.role==='voter').length}</strong></div><div class="card stat">Active polls<strong>${active}</strong></div><div class="card stat">Total polls<strong>${db.polls.length}</strong></div><div class="card stat">Total votes<strong>${db.votes.length}</strong></div></div><h2 class="section-title">Manage polls</h2><div class="grid">${db.polls.map(p=>`<div class="card"><span class="pill">${pollStatus(p)}</span><h3>${escapeHTML(p.title)}</h3><p>${escapeHTML(p.description)}</p><p>${db.votes.filter(v=>v.pollId===p.id).length} votes</p><div class="actions"><button onclick="adminResults('${p.id}')">Results</button><button onclick="pollEditor('${p.id}')">Edit</button><button onclick="togglePoll('${p.id}')">${p.active?'Deactivate':'Activate'}</button><button onclick="archivePoll('${p.id}')">${p.archived?'Restore':'Archive'}</button></div></div>`).join('')}</div><h2 class="section-title">Registered users</h2><div class="card">${db.users.filter(u=>u.role==='voter').map(u=>`<div class="row" style="padding:12px 0;border-bottom:1px solid var(--line)"><div><b>${escapeHTML(u.name)}</b><br><small>${escapeHTML(u.email)}</small></div><span>${db.votes.filter(v=>v.userId===u.id).length} votes</span></div>`).join('')}</div>`}function togglePoll(pid){let p=db.polls.find(p=>p.id===pid);p.active=!p.active;save();admin()}function archivePoll(pid){let p=db.polls.find(p=>p.id===pid);p.archived=!p.archived;save();admin()}function adminResults(pid){let p=db.polls.find(p=>p.id===pid);app.innerHTML=`<button onclick="admin()">← Admin dashboard</button><div class="card" style="max-width:760px;margin:20px auto"><h1>${escapeHTML(p.title)}</h1>${resultsHTML(p)}</div>`}function pollEditor(pid){let p=db.polls.find(p=>p.id===pid);app.innerHTML=`<button onclick="admin()">← Admin dashboard</button><div class="card" style="max-width:680px;margin:20px auto"><h1>${p?'Edit':'Create'} poll</h1><form id="pollForm"><label>Poll title</label><input name="title" required value="${escapeHTML(p?.title||'')}"><label>Description</label><textarea name="description" required>${escapeHTML(p?.description||'')}</textarea><div class="two"><div><label>Start date</label><input type="date" name="start" required value="${p?.start||iso(0)}"></div><div><label>End date</label><input type="date" name="end" required value="${p?.end||iso(7)}"></div></div><label>Options (one per line)</label><textarea name="options" required>${p?p.options.map(o=>o.name).join('\n'):''}</textarea><label>Results visibility</label><select name="visibility"><option value="always">Always visible</option><option value="afterVote">After user votes</option><option value="afterClose">After poll closes</option></select><label class="option"><input name="active" type="checkbox" ${!p||p.active?'checked':''}> Active</label><button class="primary full">Save poll</button></form></div>`;document.querySelector('[name="visibility"]').value=p?.visibility||'afterVote';document.getElementById('pollForm').onsubmit=e=>{e.preventDefault();let f=e.target,v=Object.fromEntries(new FormData(f)),names=v.options.split('\n').map(x=>x.trim()).filter(Boolean);if(names.length<2)return alert('Add at least two options.');if(v.end<v.start)return alert('End date must be after start date.');if(p){let old=p.options;Object.assign(p,{title:v.title,description:v.description,start:v.start,end:v.end,active:!!v.active,visibility:v.visibility,options:names.map(n=>old.find(o=>o.name===n)||{id:id(),name:n})})}else db.polls.push({id:id(),title:v.title,description:v.description,start:v.start,end:v.end,active:!!v.active,archived:false,visibility:v.visibility,options:names.map(name=>({id:id(),name}))});save();admin()}}syncNav();me()?home():auth();
</script></body></html>
